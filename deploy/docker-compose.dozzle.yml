# Dozzle — live container-log viewer (https://dozzle.dev).
#
# This is a SEPARATE Compose project on purpose: it is an operations tool,
# not an application dependency. Keeping it out of deploy/docker-compose.yml
# preserves that stack's hard invariants (§10.4 "never mount the Docker
# socket in the app stack", no published host ports) and the tests that
# enforce them — the socket mount lives only here.
#
# Requirements:
#   - MUST be deployed on the SAME Docker daemon as ai-pr-reviewer — Dozzle
#     sees the containers of the host whose socket it reads. Run it on the
#     Dokploy host, not in another container/VM.
#   - The Docker socket is root-equivalent on the host. Mitigations here:
#     read-only mount, authentication REQUIRED, container actions and shell
#     access disabled, TLS terminated by Traefik. Note that `:ro` limits the
#     file, not the Docker API — if you want API write-protection too, front
#     the socket with a socket proxy (tecnativa/docker-socket-proxy) instead
#     of mounting it directly.
#
# Auth: Dozzle v11 uses the `simple` provider with a users.yml file in /data.
# This file is generated by the `dozzle-init` one-shot from environment
# variables, so no host-side file creation is needed — deploy the compose
# file and set:
#
#   DOZZLE_ADMIN_PASSWORD   (required)  password for the `admin` user
#   DOZZLE_ADMIN_EMAIL      (optional)  default admin@localhost
#   DOZZLE_ADMIN_NAME       (optional)  default Admin
#   DOZZLE_FORCE_USERS=1    (optional)  regenerate users.yml (password change)
#
# users.yml lives in the `dozzle-data` named volume, which survives redeploys.
# The generated file contains bcrypt hashes, never plaintext.
#
# Ingress: no host port is published. In Dokploy, attach a domain (e.g.
# logs.yourdomain.com or an sslip.io name containing the public IP) to the
# `dozzle` service with Container Port `8080`; Traefik terminates TLS and
# routes over dokploy-network. Restrict the domain to admin IPs/VPN where
# possible.
#
# Behind CGNAT (ISP does not give the router a public IPv4) inbound port
# forwarding is impossible. For that case the optional `dozzle-tunnel`
# service opens an OUTBOUND Cloudflare quick tunnel and publishes Dozzle at
# a random https://<name>.trycloudflare.com URL. Read it from the service
# logs after deploy:
#
#   docker logs ai-pr-reviewer-logs-dozzle-tunnel-1 | grep trycloudflare
#
# The tunnel URL changes whenever the container is recreated. Remove the
# service if you have a real public IP or do not want public exposure.
# Local smoke (no Dokploy): use docker-compose.dozzle.local.yml.
#
# Validate: docker compose -f deploy/docker-compose.dozzle.yml config

name: ai-pr-reviewer-logs

services:
  # One-shot init: materialise /data/users.yml from env vars inside the shared
  # volume. This keeps authentication deployable from Compose alone (Dokploy
  # UI), with no shell access to the host.
  dozzle-init:
    image: amir20/dozzle:v11.4.1-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # The script receives values as positional args ($1..$4) so Compose never
    # has to interpolate shell `$VAR` references inside the command.
    command:
      - |
        set -eu
        if [ -s /data/users.yml ] && [ "$4" != "1" ]; then
          echo "users.yml already present; leaving it untouched"
          exit 0
        fi
        if [ -z "$1" ]; then
          echo "DOZZLE_ADMIN_PASSWORD must be set" >&2
          exit 1
        fi
        umask 077
        /dozzle generate admin \
          --password "$1" \
          --email "$2" \
          --name "$3" \
          > /data/users.yml
        echo "users.yml generated for user 'admin'"
      - dozzle-init
      - ${DOZZLE_ADMIN_PASSWORD:-}
      - ${DOZZLE_ADMIN_EMAIL:-admin@localhost}
      - ${DOZZLE_ADMIN_NAME:-Admin}
      - ${DOZZLE_FORCE_USERS:-0}
    volumes:
      - dozzle-data:/data
    network_mode: none

  dozzle:
    # Pinned release (matches the init image). Bump deliberately.
    image: amir20/dozzle:v11.4.1
    restart: unless-stopped
    depends_on:
      dozzle-init:
        condition: service_completed_successfully
    volumes:
      # users.yml + session secret + settings. The named volume survives
      # redeploys, so the generated credentials persist.
      - dozzle-data:/data
      # The one host mount the whole point of Dozzle depends on.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Simple auth is mandatory for this deployment — Dozzle must never start
    # unauthenticated on an ingress-reachable network. It fails closed: if
    # users.yml is missing, login is impossible (no anonymous access).
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      # Mutating capabilities off (docs: keep actions/shell disabled unless
      # needed). Defaults are already false; pinned explicitly as a guard.
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_DISABLE_SETUP_WIZARD: "true"
      DOZZLE_HOSTNAME: dokploy-host
    # Container port only — Dokploy Traefik reaches it over dokploy-network
    # (Domains tab → Container Port 8080). No host binding, matching the
    # main stack's no-published-ports invariant.
    expose:
      - "8080"
    # Dozzle talks to the local socket (no network egress needed) and serves
    # the UI to Traefik on the edge network. Nothing else.
    networks:
      - edge
    healthcheck:
      # The image is `scratch` with the binary at /dozzle (not on PATH).
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Optional public ingress for CGNAT / no-port-forwarding environments.
  # cloudflared dials OUT to Cloudflare, so it needs no inbound ports and
  # bypasses the ISP NAT. Quick tunnels get a random *.trycloudflare.com
  # hostname (printed in the logs) and are intended for demos/ops access,
  # not as a stable production URL. Dozzle auth is still required.
  dozzle-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://dozzle:8080
    depends_on:
      dozzle:
        condition: service_healthy
    # Same edge network as dozzle; Docker DNS resolves the service name.
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  # Dozzle state: users.yml (bcrypt hashes), session secret and settings.
  dozzle-data:

networks:
  # Public edge (Dokploy HTTPS ingress). Same external network the main
  # stack's probot uses — Dokploy creates it; name overridable for parity.
  edge:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
