# Local smoke-run override for the Dozzle stack (no Dokploy/Traefik).
# Publishes the UI on localhost only so you can verify it on a dev machine:
#
#   docker compose \
#     -f deploy/docker-compose.dozzle.yml \
#     -f deploy/docker-compose.dozzle.local.yml \
#     up -d
#
# 127.0.0.1-only binding keeps it off the public interface. The external
# `dokploy-network` is redefined as a local, Compose-created network so this
# works on a machine without Dokploy.

services:
  dozzle:
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8080}:8080"

networks:
  edge:
    name: ai-pr-reviewer-logs-local
    external: false
