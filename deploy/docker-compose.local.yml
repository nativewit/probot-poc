# Local smoke-run override (docs/deployment.md §4). Publishes probot on
# localhost only so the verification curl works without Dokploy/Traefik.
#
# The production compose deliberately publishes NO host ports — on Dokploy,
# Traefik reaches probot over dokploy-network via the Domains tab. This
# override is for `docker compose` runs on a dev machine:
#
#   docker compose \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.local.yml \
#     up -d
#
# 127.0.0.1-only binding keeps it off the public interface.

services:
  probot:
    ports:
      - "127.0.0.1:${PROBOT_PORT:-3000}:3000"
